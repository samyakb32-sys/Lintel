[package]
name = "notch-feat-displays-keepawake"
description = "METEOR V1 feature: Displays keepawake"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notch-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
svc-sysevents = { path = "../svc-sysevents" }
svc-shell = { path = "../svc-shell" }
# List the Win32 API sets this feature calls; Cargo unifies them across the workspace.
windows = { version = "0.61", features = [
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Power",
  "Win32_System_Rpc",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
