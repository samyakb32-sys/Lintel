[package]
name = "notch-feat-controls-toggles"
description = "METEOR V1 feature: Controls toggles"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notch-core = { path = "../core" }
svc-audio = { path = "../svc-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# List the Win32 API sets this feature calls; Cargo unifies them across the workspace.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
