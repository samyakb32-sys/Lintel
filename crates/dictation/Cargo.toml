[package]
name = "notch-feat-dictation"
description = "METEOR V1 feature: Dictation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notch-core = { path = "../core" }
svc-input = { path = "../svc-input" }
svc-inject = { path = "../svc-inject" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# List the Win32 API sets this feature calls; Cargo unifies them across the workspace.
windows = { version = "0.61", features = ["Foundation", "Foundation_Collections", "Globalization", "Media_SpeechRecognition", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
