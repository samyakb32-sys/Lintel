[package]
name = "notch-feat-huds-power"
description = "METEOR V1 feature: Levels and battery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notch-core = { path = "../core" }
svc-audio = { path = "../svc-audio" }
svc-sysevents = { path = "../svc-sysevents" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# List the Win32 API sets this feature calls; Cargo unifies them across the workspace.
windows = { version = "0.61", features = [
  "Devices_Power",
  "Foundation",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Rpc",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Only the microphone probe opens a capture stream (examples/huds-power-mic-probe.rs).
[dev-dependencies]
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_System_Com_StructuredStorage"] }
