[package]
name = "svc-sysevents"
description = "METEOR V1 shared service: Sysevents"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notch-core = { path = "../core" }
# List the Win32 API sets this service calls; Cargo unifies them across the workspace.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }
