[package]
name = "meteor-speak"
description = "METEOR V1 voice: the speech server (Kokoro), built as meteor-speak.exe"
version.workspace = true
edition.workspace = true
license.workspace = true

# One binary, src/main.rs → meteor-speak.exe. The wire it speaks is crates/voice/src/speak_proto.rs,
# included by path: this crate and notch-feat-voice do not depend on each other.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The engine (VOICE §7.2): sherpa-onnx's own Rust crate, pinned, linked to its C API as a DLL. The
# default `static` feature links archives built with the static C runtime, which does not mix with the
# workspace's. Its build script fetches the prebuilt Windows x64 runtime of the same version from the
# project's GitHub release into target/sherpa-onnx-prebuilt/ (once) and copies sherpa-onnx-c-api.dll and
# onnxruntime.dll beside the built meteor-speak.exe: the three files ship together, in one folder.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
