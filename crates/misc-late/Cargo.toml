[package]
name = "notch-feat-misc-late"
description = "METEOR V1 feature: Tools and setup"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notch-core = { path = "../core" }
notch-brand = { path = "../brand" }
# Cleaning mode and the Explorer paste take keys through the shared hook.
svc-input = { path = "../svc-input" }
# The watch reads a window as pixels and text.
svc-capture = { path = "../svc-capture" }
svc-windows = { path = "../svc-windows" }
# The import dialog, the clipboard picture written as a file, Reveal.
svc-shell = { path = "../svc-shell" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# List the Win32 API sets this feature calls; Cargo unifies them across the workspace.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The probe draws a number into a picture of its own for the watch to read.
windows = { version = "0.61", features = [
  "Win32_Graphics_Gdi",
] }

# Every example of the workspace is linked into target/<profile>/examples/ under
# its own name, so it is named after its package.
[[example]]
name = "misc-late-probe"
path = "examples/probe.rs"
