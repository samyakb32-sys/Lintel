[package]
name = "notch-feat-window-layout"
description = "METEOR V1 feature: Window layout"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notch-core = { path = "../core" }
# The mouse and keyboard hooks of focus follows the pointer and close protection.
svc-input = { path = "../svc-input" }
# The window in front, the open windows, putting one in front, asking one to close.
svc-windows = { path = "../svc-windows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# List the Win32 API sets this feature calls; Cargo unifies them across the workspace.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# The probe is examples/window-layout-probe.rs: named after the crate, as every
# example of the workspace is linked into the same folder.
