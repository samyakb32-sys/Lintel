[package]
name = "notch-feat-weather"
description = "METEOR V1 feature: Weather"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notch-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# List the Win32 API sets this feature calls; Cargo unifies them across the workspace.
windows = { version = "0.61", features = [] }

[dev-dependencies]
notch-feat-island-extras = { path = "../island-extras" }
