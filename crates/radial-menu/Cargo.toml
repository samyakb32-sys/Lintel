[package]
name = "notch-feat-radial-menu"
description = "METEOR V1 feature: Radial menu"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notch-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
base64 = "0.22"
svc-input = { path = "../svc-input" }
svc-media = { path = "../svc-media" }
svc-shell = { path = "../svc-shell" }
svc-inject = { path = "../svc-inject" }
svc-windows = { path = "../svc-windows" }
# List the Win32 API sets this feature calls; Cargo unifies them across the workspace.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "radial-probe"
path = "examples/radial-probe.rs"
