[package]
name = "svc-fs"
description = "METEOR V1 shared service: Fs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notch-core = { path = "../core" }
# Part of windows-rs and already what `windows` 0.61 is built on: the code its `implement` macro writes names this crate.
windows-core = "0.61"
# List the Win32 API sets this service calls; Cargo unifies them across the workspace.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }
